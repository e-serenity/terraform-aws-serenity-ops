[project]
name = "serenity-bot"
version = "1.0.0"
description = "Serenity-Ops AI Orchestrator with Slack Socket Mode, AWS Bedrock & MCP sub-agents."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    # Slack Socket Mode bot
    "slack-bolt>=1.21",
    # Agent stack — mcp is pulled transitively by langchain-mcp-adapters,
    # boto3 by langchain-aws
    "langchain>=0.3",
    "langchain_google_genai>=2",
    "langgraph>=0.2",
    "langchain-mcp-adapters>=0.0.11",
    "langchain-aws",
    # Internal /health endpoint for ECS healthcheck
    "fastapi>=0.115",
    "uvicorn>=0.34.3",
    "requests>=2.32",
    "awslabs-aws-iac-mcp-server",
    "awslabs-cloudwatch-mcp-server",
    "python-gitlab>=4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest==7.4.*",
    "pytest-cov==4.1.*",
    "pytest-mock==3.11.*",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
